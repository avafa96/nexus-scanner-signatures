# Release template for avafa96/nexus-scanner-signatures only.
# No application checkout, private artifacts, credentials or paid runner.
name: Nexus public service observation
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      controlled_failure:
        description: "Owner-authorized notification check (no production outage)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nexus-public-service-observation
  cancel-in-progress: false
jobs:
  public-edges:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public services outside the production host
        env:
          CONTROLLED_FAILURE: ${{ inputs.controlled_failure == true && 'true' || 'false' }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, os, sys, time, urllib.request
          targets = {
            'WEB_EDGE': 'https://nexusaerosupply.com/en',
            'PUBLIC_SOURCING_API': 'https://nexusaerosupply.com/api/platform/api/v1/marketplace/public/posts',
            'IDENTITY_EDGE': 'https://identity.nexusaerosupply.com/realms/nexus-aerochain',
            'AEROPASSPORT_EDGE': 'https://aeropassport.nexusaerosupply.com/en',
          }
          def check(item):
              code, url = item
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={'user-agent': 'Nexus-external-observer/1'})
                      with urllib.request.urlopen(request, timeout=8) as response:
                          response.read(128)
                          if 200 <= response.status < 300:
                              return {'code': code, 'status': 'PASS'}
                  except Exception:
                      pass
                  if attempt < 2:
                      time.sleep(3)
              return {'code': code, 'status': 'FAIL'}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              checks = list(pool.map(check, targets.items()))
          if os.environ.get('CONTROLLED_FAILURE') == 'true':
              checks.append({'code': 'OWNER_CONTROLLED_NOTIFICATION_CHECK', 'status': 'FAIL'})
          print(json.dumps({'observer': 'external-free-runner', 'privateDataRead': False, 'checks': checks}))
          sys.exit(1 if any(item['status'] != 'PASS' for item in checks) else 0)
          PY
